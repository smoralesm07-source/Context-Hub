<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGP · Acceso sin contraseña</title>
<style>
:root{--bg:#071018;--panel:#0d1722;--line:#213244;--text:#ecf3f8;--muted:#96a8b8;--accent:#55d3b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#10293a 0,#071018 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(450px,calc(100% - 32px));background:rgba(13,23,34,.96);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 16px 40px #0004}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border:1px solid #2f675d;border-radius:12px;display:grid;place-items:center;background:#0d2526;color:var(--accent);font-weight:800}h1{font-size:18px;margin:0}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{display:grid;gap:7px;margin:18px 0}.field label{font-size:12px;color:var(--muted)}input{width:100%;background:#08131d;border:1px solid #263b4f;color:var(--text);border-radius:9px;padding:12px}.btn{width:100%;border:0;border-radius:9px;padding:11px 13px;cursor:pointer;background:#1f6f60;color:#fff;font:inherit}.notice{margin-top:14px;padding:10px 12px;border-radius:9px;background:#0b201c;border:1px solid #234e45;color:#b6eadc;font-size:12px}.error{background:#281415;border-color:#643235;color:#ffb9b9}
</style></head><body><div class="card"><div class="brand"><div class="logo">R</div><div><h1>RIGP</h1><div class="muted">Piloto Controlado · acceso sin contraseña</div></div></div><p class="muted" style="margin-top:20px">Ingresa tu correo habilitado. Recibirás un enlace de acceso. Al abrirlo volverás automáticamente al piloto con la sesión iniciada.</p><form id="form"><div class="field"><label>Correo habilitado</label><input id="email" type="email" required autocomplete="email" value="smorales316@yahoo.com"></div><button class="btn" id="send">Enviar enlace de acceso</button></form><div id="msg"></div></div>
<script>
const SUPABASE_URL='https://ldmtlwzqaqmegedktlxr.supabase.co';
const KEY='sb_publishable_Nu21dZFBM3NwtIvOwIM8ag_9tyfDJyR';
const REDIRECT='https://smoralesm07-source.github.io/Context-Hub/rigp-pilot/passwordless.html';
const msg=document.getElementById('msg');
function show(t,err=false){msg.className='notice'+(err?' error':'');msg.textContent=t}
function capture(){
 const p=new URLSearchParams(location.hash.replace(/^#/,''));
 const access=p.get('access_token'), refresh=p.get('refresh_token');
 if(!access||!refresh)return false;
 const session={access_token:access,refresh_token:refresh,token_type:p.get('token_type')||'bearer',expires_in:Number(p.get('expires_in')||3600),expires_at:Math.floor(Date.now()/1000)+Number(p.get('expires_in')||3600)};
 localStorage.setItem('rigp_session',JSON.stringify(session));
 history.replaceState({},'',location.pathname);
 location.replace('./');
 return true;
}
if(!capture())document.getElementById('form').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('send');btn.disabled=true;try{const email=document.getElementById('email').value.trim();const r=await fetch(SUPABASE_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(REDIRECT),{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({email,create_user:false})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.msg||d.message||'No fue posible enviar el enlace.')}show('Enlace enviado. Revisa tu correo y ábrelo en este mismo navegador.');}catch(err){show(err.message,true)}finally{btn.disabled=false}};
</script></body></html>
