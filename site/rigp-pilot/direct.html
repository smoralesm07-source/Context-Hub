<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGP · Vista temporal</title><style>:root{--bg:#071018;--panel:#0d1722;--line:#213244;--text:#ecf3f8;--muted:#96a8b8;--accent:#55d3b0;--warn:#f0d38a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#10293a 0,#071018 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.shell{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border:1px solid #2f675d;border-radius:12px;display:grid;place-items:center;background:#0d2526;color:var(--accent);font-weight:800}.card{background:rgba(13,23,34,.96);border:1px solid var(--line);border-radius:14px}.pad{padding:18px}.muted{color:var(--muted)}.small{font-size:12px}.badge{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--warn);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{padding:14px;background:#0a141e;border:1px solid var(--line);border-radius:10px}.metric .n{font-size:24px;font-weight:750}.metric .l{font-size:11px;color:var(--muted);margin-top:4px}.section{padding:18px;border-top:1px solid var(--line)}.section:first-child{border-top:0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #1b2b3c;text-align:left;vertical-align:top}.sc{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#0a141e}.sc summary{cursor:pointer;font-weight:650}.pill{display:inline-block;padding:3px 7px;border-radius:999px;border:1px solid var(--line);font-size:10px;color:var(--muted);margin-left:6px}.err{padding:12px;border:1px solid #643235;background:#281415;color:#ffb9b9;border-radius:9px}.ok{padding:10px 12px;border:1px solid #2f675d;background:#0d2526;color:#b6eadc;border-radius:9px;margin-bottom:14px}a{color:#72b7ff}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:12px}}</style></head><body><div id="app" class="shell"></div><script>const SB='https://ldmtlwzqaqmegedktlxr.supabase.co';const KEY='sb_publishable_Nu21dZFBM3NwtIvOwIM8ag_9tyfDJyR';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const qp=new URLSearchParams(location.search);if(qp.get('k')){sessionStorage.setItem('rigp_temp_k',qp.get('k'));history.replaceState({},'',location.pathname)}const token=sessionStorage.getItem('rigp_temp_k');async function load(){if(!token){return fail('Este enlace temporal no contiene una credencial válida.')}let r=await fetch(SB+'/rest/v1/rpc/rigp_temp_admin_preview',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({p_token:token})});let d=await r.json().catch(()=>null);if(!r.ok)return fail(d?.message||'Acceso temporal no válido.');render(d)}function fail(m){app.innerHTML='<div class="card pad" style="margin-top:10vh"><h2>RIGP</h2><div class="err">'+esc(m)+'</div></div>'}function render(d){let run=d.run||{},a=d.acceptance||{},parts=d.participants||[],sc=d.scenarios||[],res=d.results||[];app.innerHTML='<div class="top"><div class="brand"><div class="logo">R</div><div><h2 style="margin:0">RIGP · Piloto Controlado</h2><div class="muted small">Vista administrativa temporal</div></div></div><span class="badge">SIN LOGIN · SOLO LECTURA</span></div><div class="ok">Acceso temporal habilitado. Esta vista permite revisar el piloto en vivo, pero no modificar resultados ni cerrar el run.</div><div class="card"><div class="section"><div class="muted small">'+esc(run.run_id)+'</div><h2 style="margin:4px 0 4px">'+esc(run.run_name)+'</h2><div class="muted small">Estado: '+esc(run.status)+' · Protocolo '+esc(run.protocol_version)+' · Blind mode '+(run.blind_mode?'activo':'inactivo')+'</div><div class="grid"><div class="metric"><div class="n">'+parts.filter(x=>x.participant_role==='ANALYST'&&x.active).length+'</div><div class="l">Analistas activos</div></div><div class="metric"><div class="n">'+res.filter(x=>x.submitted_at).length+'</div><div class="l">Evaluaciones enviadas</div></div><div class="metric"><div class="n">'+esc(a.pending_count??'-')+'</div><div class="l">Criterios pendientes</div></div><div class="metric"><div class="n">'+esc(a.pilot_acceptance_status??'-')+'</div><div class="l">Aceptación</div></div></div></div><div class="section"><h3>Participantes</h3><table class="table"><thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th>Iniciados</th><th>Enviados</th></tr></thead><tbody>'+parts.map(p=>'<tr><td>'+esc(p.display_name)+'</td><td>'+esc(p.participant_role)+'</td><td>'+(p.active?'Activo':'Inactivo')+'</td><td>'+esc(p.started_count)+'</td><td>'+esc(p.submitted_count)+'</td></tr>').join('')+'</tbody></table></div><div class="section"><h3>Escenarios ciegos</h3>'+sc.map(s=>'<details class="sc"><summary>Escenario '+esc(s.public_code)+' — '+esc(s.display_title.replace(/^Escenario [A-G] — /,''))+' <span class="pill">corte '+esc(s.temporal_cutoff)+'</span></summary><div class="small" style="margin-top:10px"><b>Antecedentes</b><pre style="white-space:pre-wrap;color:#d8e3eb">'+esc(JSON.stringify(s.header,null,2))+'</pre><b>Evidencia</b><pre style="white-space:pre-wrap;color:#d8e3eb">'+esc(JSON.stringify(s.evidence,null,2))+'</pre><b>Faltantes conocidos</b><pre style="white-space:pre-wrap;color:#d8e3eb">'+esc(JSON.stringify(s.known_missing,null,2))+'</pre></div></details>').join('')+'</div><div class="section"><h3>Resultados registrados</h3>'+(res.length?'<table class="table"><thead><tr><th>Esc.</th><th>Analista</th><th>Estado</th><th>Gate</th><th>Confianza</th><th>Decisión</th></tr></thead><tbody>'+res.map(x=>'<tr><td>'+esc(x.public_code)+'</td><td>'+esc(x.analyst)+'</td><td>'+(x.submitted_at?'Enviado':'Borrador')+'</td><td>'+esc(x.analyst_gate_outcome||'')+'</td><td>'+esc(x.confidence==null?'':Math.round(Number(x.confidence)*100)+'%')+'</td><td>'+esc(x.analyst_decision||'')+'</td></tr>').join('')+'</tbody></table>':'<div class="muted small">Todavía no hay resultados registrados.</div>')+'</div></div>'}load();</script></body></html>
