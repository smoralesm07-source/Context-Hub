<body><div id="root" class="app"></div>
<script>
const SB='https://ldmtlwzqaqmegedktlxr.supabase.co';
const KEY='sb_publishable_Nu21dZFBM3NwtIvOwIM8ag_9tyfDJyR';
const root=document.getElementById('root');
const qp=new URLSearchParams(location.search);if(qp.get('k')){sessionStorage.setItem('rigp_temp_k',qp.get('k'));history.replaceState({},'',location.pathname)}
const token=sessionStorage.getItem('rigp_temp_k');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>new Intl.NumberFormat('es-CL',{maximumFractionDigits:1}).format(Number(n||0));
const fmtCLP=n=>n==null?'—':new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n));
const pct=n=>n==null?'—':Math.round(Number(n)*100)+'%';
const fmtDate=s=>{if(!s)return'—';try{return new Intl.DateTimeFormat('es-CL',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(s))}catch{return s}};
const fmtDT=s=>{if(!s)return'—';try{return new Intl.DateTimeFormat('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(s))}catch{return s}};
const label=s=>String(s??'').replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase());
let DATA=null,PILOT=null,view='pulse',selectedCase=null,selectedIntake=null,caseTab='summary',caseCache={},intakeCache={};
let sim=JSON.parse(localStorage.getItem('rigp_ops_sim')||'{}');
function saveSim(){localStorage.setItem('rigp_ops_sim',JSON.stringify(sim))}
async function rpc(name,args){const r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify(args)});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||('Error '+r.status));return d}
function fail(m){root.innerHTML='<div class="error"><h2 style="margin-top:0">RIGP</h2>'+esc(m)+'<div style="margin-top:12px;font-size:11px;color:#c68f8f">Abre primero el enlace temporal del piloto para cargar la credencial de sesión.</div></div>'}
async function boot(){if(!token)return fail('No existe una sesión temporal activa.');root.innerHTML='<div style="height:100vh;display:grid;place-items:center"><div class="spinner"></div></div>';try{[DATA,PILOT]=await Promise.all([rpc('rigp_temp_ops_preview',{p_token:token}),rpc('rigp_temp_admin_preview',{p_token:token})]);render()}catch(e){fail(e.message)}}
function chip(t,c=''){return '<span class="chip '+c+'">'+esc(label(t))+'</span>'}
function severityChip(s){const c=s==='HIGH'||s==='CRITICAL'?'red':s==='MEDIUM'?'amber':'blue';return chip(s,c)}
function gateChip(v){return v?chip('Escalable','green'):chip('Watch only','amber')}
function shell(content){const f=DATA?.funnel||{};root.innerHTML='<div class="topbar"><div class="brand"><div class="logo">R</div><div><h1>RIGP · Operación Shadow</h1><p>Simulador operacional · método congelado</p></div></div><div class="top-actions"><span class="badge hide-mobile"><span class="dot"></span> '+esc(DATA?.shadow?.status||'')+' · '+esc(DATA?.shadow?.shadow_run_id||'')+'</span><span class="badge">SOLO LECTURA BACKEND</span></div></div><div class="layout"><aside class="sidebar"><div class="nav-group">Operación</div>'+nav('pulse','Pulso operativo','')+nav('intake','Intake',f.pending_review)+nav('cases','Portafolio',f.portfolio_cases)+nav('attention','Atención',f.attention_items)+'<div class="nav-group">Control</div>'+nav('sources','Fuentes','')+nav('shadow','Shadow','')+nav('pilot','Piloto ciego','')+'<div class="side-note"><b>Guardrail activo</b><br>Las acciones del simulador se guardan solo en este navegador. No modifican RIGP ni la evaluación ciega.</div></aside><main class="main">'+content+'</main></div>';bindGlobal()}
function nav(id,name,count){return '<button class="nav-btn '+(view===id?'active':'')+'" data-nav="'+id+'"><span>'+name+'</span>'+(count!==''?'<span class="nav-count">'+esc(count)+'</span>':'')+'</button>'}
function bindGlobal(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;selectedCase=null;selectedIntake=null;render()});document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case));document.querySelectorAll('[data-intake]').forEach(b=>b.onclick=()=>openIntake(b.dataset.intake));document.querySelectorAll('[data-attcase]').forEach(b=>b.onclick=()=>openCase(b.dataset.attcase))}
function render(){if(!DATA)return;({pulse:renderPulse,intake:renderIntake,cases:renderCases,attention:renderAttention,sources:renderSources,shadow:renderShadow,pilot:renderPilot}[view]||renderPulse)()}
function head(t,s,extra=''){return '<div class="pagehead"><div><h2>'+esc(t)+'</h2><p>'+esc(s)+'</p></div>'+extra+'</div>'}
function renderPulse(){const f=DATA.funnel,att=DATA.attention||[],pending=(DATA.intake||[]).filter(x=>x.disposition==='PENDING_REVIEW').slice(0,6),cases=DATA.cases||[];let metrics=[['44','Registros de entrada','observaciones + provider signals'],[f.logical_cases,'Casos lógicos','deduplicados por proceso/proveedor'],[f.pending_review,'Por revisar','requieren criterio humano'],[f.portfolio_cases,'En portafolio','casos actualmente vigilados'],[f.live_gates,'Escalables','gate validado actual'],[f.attention_items,'Atenciones','no bloqueantes hoy']];let html=head('Pulso operativo','Qué está ocurriendo en RIGP ahora, sin contaminar el piloto ciego.','<button class="btn" id="reload">Actualizar</button>')+'<div class="metric-grid">'+metrics.map(m=>'<div class="card metric"><div class="value">'+esc(m[0])+'</div><div class="label">'+esc(m[1])+'</div><div class="sub">'+esc(m[2])+'</div></div>').join('')+'</div><div class="card" style="margin-top:12px"><div class="section-title"><h3>Embudo de decisión</h3><span>ninguna señal se convierte en caso automáticamente</span></div><div class="pad"><div class="funnel">'+[['44','Señales crudas','captura'],[f.logical_cases,'Casos lógicos','reconciliación'],[f.pending_review,'Revisión humana','admisión'],[f.portfolio_cases,'Portafolio','watchlist'],[f.live_gates,'Escalamiento','gate validado']].map(x=>'<div class="step"><div class="n">'+esc(x[0])+'</div><div class="t">'+esc(x[1])+'</div><div class="hint">'+esc(x[2])+'</div></div>').join('')+'</div></div></div><div class="section-grid"><div class="card"><div class="section-title"><h3>Qué revisar ahora</h3><span>'+pending.length+' primeras señales de '+f.pending_review+'</span></div><div class="pad queue-list">'+pending.map(intakeRow).join('')+'</div></div><div class="card"><div class="section-title"><h3>Atención operacional</h3><span>'+att.length+' ítems</span></div><div class="pad attention">'+(att.length?att.map(attentionRow).join(''):'<div class="empty">Sin atenciones activas.</div>')+'</div></div></div><div class="card" style="margin-top:12px"><div class="section-title"><h3>Portafolio actual</h3><span>7 casos bajo observación</span></div>'+caseTable(cases)+'</div>';shell(html);document.getElementById('reload').onclick=reload}
function intakeRow(x){return '<div class="queue-row" data-intake="'+esc(x.logical_key)+'"><div class="row"><span class="mono tiny">'+esc(x.tender_id||'sin proceso')+'</span><span>'+chip(x.review_lane,'blue')+'</span></div><h4>'+esc(x.buyer_name||x.buyer_rut)+' → '+esc(x.supplier_rut||'—')+'</h4><p>Prioridad '+esc(x.max_review_priority??'—')+' · '+esc((x.signal_codes||[]).join(' · '))+'</p></div>'}
function attentionRow(x){return '<div class="attention-item" '+(x.candidate_id?'data-attcase="'+esc(x.candidate_id)+'"':'')+'><div class="row">'+severityChip(x.severity)+'<span class="tiny muted">P'+esc(x.priority_score)+'</span></div><h4>'+esc(x.title)+'</h4><p>'+esc(x.recommended_action)+'</p></div>'}
function caseTable(rows){return '<div class="table-wrap"><table class="table"><thead><tr><th>Proceso</th><th>Hipótesis</th><th>Conf.</th><th>Evidencia decisión</th><th>Gate</th><th>Siguiente acción</th></tr></thead><tbody>'+rows.map(x=>'<tr class="clickable" data-case="'+esc(x.candidate_id)+'"><td><div class="mono">'+esc(x.tender_id)+'</div><div class="tiny muted">'+esc(x.supplier_rut)+'</div></td><td>'+esc(x.title)+'</td><td>'+pct(x.case_confidence)+'</td><td><div style="min-width:100px"><div class="progress"><span style="width:'+Math.min(100,Number(x.coverage_pct||0))+'%"></span></div><div class="tiny muted" style="margin-top:3px">'+esc(x.coverage_pct??0)+'% · '+esc(label(x.coverage_status||''))+'</div></div></td><td>'+gateChip(x.validated_case_gate_passed)+'</td><td>'+esc(label(x.pilot_next_action))+'</td></tr>').join('')+'</tbody></table></div>'}
function renderIntake(){let rows=DATA.intake||[];let html=head('Intake de señales','Señales reconciliadas antes de convertirse en casos.')+'<div class="card pad"><div class="filters"><input class="control search" id="q" placeholder="Buscar proceso, comprador o RUT"><select class="control" id="disp"><option value="">Todos los estados</option><option>PENDING_REVIEW</option><option>RECONCILED_EXISTING</option></select><select class="control" id="lane"><option value="">Todas las revisiones</option><option>PRICE_COMPARABILITY_REVIEW</option><option>FINAL_BENEFIT_AND_READJUDICATION_REVIEW</option></select></div><div id="intakeBody"></div></div>';if(selectedIntake)html='<div class="split"><div>'+html+'</div><div id="intakeDetail" class="card detail-panel"></div></div>';shell(html);const draw=()=>{let q=document.getElementById('q').value.toLowerCase(),d=document.getElementById('disp').value,l=document.getElementById('lane').value;let rr=rows.filter(x=>(!d||x.disposition===d)&&(!l||x.review_lane===l)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById('intakeBody').innerHTML='<div class="queue-list">'+rr.map(intakeRow).join('')+'</div>';bindGlobal()};['q','disp','lane'].forEach(id=>document.getElementById(id).oninput=draw);draw();if(selectedIntake)renderIntakeDetail()}
async function openIntake(k){selectedIntake=k;view='intake';if(!intakeCache[k]){try{intakeCache[k]=await rpc('rigp_temp_ops_intake',{p_token:token,p_logical_key:k})}catch(e){alert(e.message)}}render()}
function renderIntakeDetail(){const d=intakeCache[selectedIntake],el=document.getElementById('intakeDetail');if(!d||!el)return;const x=d.intake||{},local=sim['intake:'+selectedIntake]||{};el.innerHTML='<div class="detail-head"><button class="drawer-close" id="closeIntake">×</button><div class="tiny mono muted">'+esc(x.tender_id||selectedIntake)+'</div><h3>'+esc(x.buyer_name||x.buyer_rut)+'</h3><p>Proveedor '+esc(x.supplier_rut)+' · '+esc(label(x.review_lane))+'</p></div><div class="detail-body"><div class="kv"><div><div class="k">Prioridad</div><div class="v">'+esc(x.max_review_priority??'—')+'</div></div><div><div class="k">Estado</div><div class="v">'+esc(label(x.disposition))+'</div></div><div><div class="k">Familias</div><div class="v">'+esc((x.families||[]).join(', '))+'</div></div><div><div class="k">Señales</div><div class="v">'+esc((x.signal_codes||[]).join(', '))+'</div></div></div><h4 class="small" style="margin:14px 0 7px">Trazabilidad de entrada</h4>'+(d.raw_items||[]).map(r=>'<div class="evidence"><h4>'+esc(r.signal_code)+' · '+esc(r.source_code)+'</h4><p>'+esc(label(r.family))+' · prioridad '+esc(r.review_priority??'—')+'</p><div class="meta">'+esc(r.source_type)+' · '+fmtDT(r.observed_at)+' · scoring '+(r.scoring_eligible?'sí':'no')+'</div></div>').join('')+'<div class="sim-state"><b>Decisión simulada:</b> '+esc(local.action||'sin decisión')+(local.note?'<br>'+esc(local.note):'')+'</div><textarea class="control" id="intakeNote" style="width:100%;margin-top:8px;min-height:72px" placeholder="Nota de simulación">'+esc(local.note||'')+'</textarea><div class="actions"><button class="btn" data-simintake="WATCH">Mantener</button><button class="btn danger" data-simintake="DISCARD">Descartar</button><button class="btn primary" data-simintake="PROPOSE">Proponer caso</button><button class="btn" data-simintake="MORE_EVIDENCE">Pedir evidencia</button></div><div class="notice" style="margin-top:10px">Estas decisiones son de simulación UX. No cambian la disposición en Supabase mientras el piloto ciego esté activo.</div></div>';document.getElementById('closeIntake').onclick=()=>{selectedIntake=null;render()};el.querySelectorAll('[data-simintake]').forEach(b=>b.onclick=()=>{sim['intake:'+selectedIntake]={action:b.dataset.simintake,note:document.getElementById('intakeNote').value,at:new Date().toISOString()};saveSim();renderIntakeDetail()})}
function renderCases(){let rows=DATA.cases||[];let html=head('Portafolio de casos','Casos que RIGP mantiene bajo observación y validación.')+'<div class="card pad"><div class="filters"><input class="control search" id="cq" placeholder="Buscar proceso, título o RUT"><select class="control" id="gate"><option value="">Todos</option><option value="watch">Watch only</option><option value="gate">Escalables</option></select></div><div id="casesBody"></div></div>';if(selectedCase)html='<div class="split"><div>'+html+'</div><div id="caseDetail" class="card detail-panel"></div></div>';shell(html);const draw=()=>{let q=document.getElementById('cq').value.toLowerCase(),g=document.getElementById('gate').value;let rr=rows.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!g||(g==='gate'?x.validated_case_gate_passed:!x.validated_case_gate_passed)));document.getElementById('casesBody').innerHTML=caseTable(rr);bindGlobal()};['cq','gate'].forEach(id=>document.getElementById(id).oninput=draw);draw();if(selectedCase)renderCaseDetail()}
async function openCase(id){selectedCase=id;view='cases';if(!caseCache[id]){try{caseCache[id]=await rpc('rigp_temp_ops_case',{p_token:token,p_candidate_id:id})}catch(e){alert(e.message)}}render()}
function renderCaseDetail(){const d=caseCache[selectedCase],el=document.getElementById('caseDetail');if(!d||!el)return;const c=d.candidate||{},local=sim['case:'+selectedCase]||{};let body='';if(caseTab==='summary')body=caseSummary(d);if(caseTab==='evidence')body=caseEvidence(d);if(caseTab==='mechanism')body=caseMechanism(d);if(caseTab==='documents')body=caseDocs(d);if(caseTab==='relationships')body=caseRelations(d);if(caseTab==='trace')body=caseTrace(d);el.innerHTML='<div class="case-head"><div><button class="drawer-close" id="closeCase">×</button><div class="tiny mono muted">'+esc(c.tender_id)+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.hypothesis_summary||'Sin hipótesis resumida.')+'</p></div></div><div class="case-kpis"><div class="mini"><div class="v">'+pct(c.confidence)+'</div><div class="k">Confianza</div></div><div class="mini"><div class="v">'+esc(c.validated_family_count??0)+'</div><div class="k">Familias válidas</div></div><div class="mini"><div class="v">'+esc(c.coverage_pct??0)+'%</div><div class="k">Cobertura</div></div><div class="mini"><div class="v">'+esc(c.open_gap_count??0)+'</div><div class="k">Brechas</div></div><div class="mini"><div class="v">'+(c.validated_case_gate_passed?'SÍ':'NO')+'</div><div class="k">Gate</div></div></div><div class="tabs">'+[['summary','Síntesis'],['evidence','Evidencia'],['mechanism','Mecanismo'],['documents','Documentos'],['relationships','Relaciones'],['trace','Trazabilidad']].map(t=>'<button class="tab '+(caseTab===t[0]?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div class="detail-body">'+body+'<div class="sim-state"><b>Estado simulado:</b> '+esc(local.action||'sin acción')+(local.note?'<br>'+esc(local.note):'')+'</div><textarea class="control" id="caseNote" style="width:100%;margin-top:8px;min-height:70px" placeholder="Nota del analista (simulación)">'+esc(local.note||'')+'</textarea><div class="actions"><button class="btn primary" data-simcase="TAKE">Tomar caso</button><button class="btn" data-simcase="WATCH">Observar</button><button class="btn warn" data-simcase="REQUEST_EVIDENCE">Pedir evidencia</button><button class="btn danger" data-simcase="ESCALATE">Proponer escalamiento</button></div><div class="notice" style="margin-top:10px">El backend permanece intacto. La acción queda en localStorage para ensayar la experiencia multiusuario futura.</div></div>';document.getElementById('closeCase').onclick=()=>{selectedCase=null;caseTab='summary';render()};el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{caseTab=b.dataset.tab;renderCaseDetail()});el.querySelectorAll('[data-simcase]').forEach(b=>b.onclick=()=>{sim['case:'+selectedCase]={action:b.dataset.simcase,note:document.getElementById('caseNote').value,at:new Date().toISOString()};saveSim();renderCaseDetail()})}
function caseSummary(d){const c=d.candidate||{},a=d.award||{},g=d.gaps||[],comp=d.decision_components||[];return '<div class="two"><div class="block"><h4>Estado analítico</h4><div style="margin-bottom:8px">'+gateChip(c.validated_case_gate_passed)+' '+chip(c.validated_gate_reason,'amber')+'</div><p><b>Comprador:</b> '+esc(c.buyer_rut)+'<br><b>Proveedor:</b> '+esc(c.supplier_rut)+'<br><b>Tipología:</b> '+esc(c.primary_typology_code)+'<br><b>Siguiente acción:</b> '+esc(label(c.pilot_next_action))+'</p></div><div class="block"><h4>Cobertura para decidir</h4><div class="progress"><span style="width:'+Math.min(100,Number(c.coverage_pct||0))+'%"></span></div><p style="margin-top:8px">'+esc(label(c.coverage_status))+'<br>Faltantes: '+esc((c.missing_components||[]).join(', ')||'ninguno')+'</p></div></div><div class="block" style="margin-top:9px"><h4>Componentes de evidencia</h4>'+comp.map(x=>'<div class="component"><div><div class="name">'+esc(x.component_name)+'</div><div class="mode">'+esc(label(x.evidence_mode))+'</div></div>'+(x.usable?chip('usable','green'):chip('hold','amber'))+'</div>').join('')+'</div><div class="block" style="margin-top:9px"><h4>Adjudicación</h4><p>Estado: <b>'+esc(label(a.award_status||c.award_status))+'</b> · ofertas '+esc(a.offer_count??'—')+' · admisibles '+esc(a.eligible_offer_count??'—')+'<br>Monto adjudicado: '+fmtCLP(a.awarded_amount_clp)+' · precio pesa '+esc(a.price_weight_pct??'—')+'%<br>Ganador más barato: '+(a.winner_is_cheapest==null?'—':a.winner_is_cheapest?'sí':'no')+' · readjudicación '+(a.readjudicated?'sí':'no')+'</p></div><div class="block" style="margin-top:9px"><h4>Brechas abiertas</h4>'+(g.length?g.map(x=>'<div class="evidence"><h4>'+esc(x.gap_code)+' '+severityChip(x.importance)+'</h4><p>'+esc(x.description)+'</p><div class="meta">Fuente requerida: '+esc(x.required_source_code||'—')+' · '+esc(label(x.status))+'</div></div>').join(''):'<p>Sin brechas registradas.</p>')+'</div>'}
function caseEvidence(d){let ev=d.evidence||[];return ev.length?ev.map(x=>{let cls=x.impact_on_case==='REMOVE_SIGNAL'?'suppressed':(x.validation_status==='SUPPORTED'||x.validation_status==='CONFIRMED')?'valid':'';return '<div class="evidence '+cls+'"><div style="display:flex;justify-content:space-between;gap:8px"><h4>'+esc(x.signal_code)+' · '+esc(label(x.family))+'</h4>'+chip(x.validation_status||'sin validar',cls==='valid'?'green':cls==='suppressed'?'amber':'blue')+'</div><p>'+esc(x.summary)+'</p><div class="meta">'+esc(x.source_code)+' · '+fmtDate(x.event_date)+' · confianza '+pct(x.confidence)+(x.amount_clp?' · '+fmtCLP(x.amount_clp):'')+'</div>'+((x.evidence_url||x.primary_source_url)?'<div class="meta"><a class="link" target="_blank" rel="noopener" href="'+esc(x.primary_source_url||x.evidence_url)+'">Abrir fuente</a></div>':'')+(x.validation_summary?'<div class="notice" style="margin-top:7px">'+esc(x.validation_summary)+' · impacto: '+esc(label(x.impact_on_case))+'</div>':'')+'</div>'}).join(''):'<div class="empty">Sin evidencia cargada.</div>'}
function caseMechanism(d){let m=d.mechanism||[],facts=d.facts||[],metrics=d.metrics||[];return '<div class="block"><h4>Etapas del mecanismo</h4>'+(m.length?m.map(x=>'<div class="evidence"><h4>'+esc(label(x.mechanism_stage))+' '+chip(x.assessment_status,x.assessment_status==='SUPPORTED'?'green':'blue')+'</h4><p>'+esc(x.rationale)+'</p><div class="meta">fuerza '+esc(x.strength??'—')+' · confianza '+pct(x.confidence)+' · preguntas '+esc((x.open_questions||[]).join(' / ')||'—')+'</div></div>').join(''):'<p>Sin evaluación de mecanismo.</p>')+'</div><div class="block" style="margin-top:9px"><h4>Hechos del proceso</h4>'+(facts.slice(0,14).map(x=>'<div class="component"><div><div class="name">'+esc(label(x.fact_code))+'</div><div class="mode">'+esc(x.value_text??x.value_numeric??x.value_date??'—')+' · '+esc(x.source_code)+'</div></div><span class="tiny muted">'+pct(x.confidence)+'</span></div>').join('')||'<p>Sin hechos estructurados.</p>')+'</div><div class="block" style="margin-top:9px"><h4>Métricas</h4>'+(metrics.map(x=>'<div class="component"><div><div class="name">'+esc(label(x.metric_code))+'</div><div class="mode">'+esc(label(x.metric_scope))+' · '+esc(x.source_code)+'</div></div><span class="small">'+esc(x.metric_value)+' '+esc(x.metric_unit||'')+'</span></div>').join('')||'<p>Sin métricas.</p>')+'</div>'}
function caseDocs(d){let docs=d.documents||[],arts=d.artifacts||[],inc=d.source_incidents||[],probes=d.source_probes||[];return '<div class="block"><h4>Registro documental</h4>'+(docs.map(x=>'<div class="evidence"><h4>'+esc(label(x.document_type))+' '+chip(x.review_status,x.review_status==='VERIFIED'?'green':'blue')+'</h4><p>'+esc(x.title||'')+'</p><div class="meta">'+esc(x.source_code)+' · '+fmtDate(x.document_date)+' · confianza '+pct(x.confidence)+(x.source_url?' · <a class="link" target="_blank" rel="noopener" href="'+esc(x.source_url)+'">fuente</a>':'')+'</div></div>').join('')||'<p>Sin documentos registrados.</p>')+'</div><div class="block" style="margin-top:9px"><h4>Artefactos capturados</h4>'+(arts.slice(0,12).map(x=>'<div class="component"><div><div class="name">'+esc(x.file_name||x.document_type)+'</div><div class="mode">'+esc(label(x.fetch_status))+' · '+esc(x.byte_size?fmtN(x.byte_size)+' bytes':'')+'</div></div>'+chip(x.document_type,'blue')+'</div>').join('')||'<p>Sin artefactos.</p>')+'</div>'+(inc.length?'<div class="block" style="margin-top:9px"><h4>Incidentes de fuente</h4>'+inc.map(x=>'<div class="evidence suppressed"><h4>'+esc(x.document_type)+' · '+esc(x.incident_type)+'</h4><p>'+esc(x.observed_description)+'</p><div class="meta">'+esc(x.retry_policy)+' · cierre: '+esc(x.closure_condition)+'</div></div>').join('')+'</div>':'')+(probes.length?'<div class="block" style="margin-top:9px"><h4>Último probe</h4>'+probes.slice(0,3).map(x=>'<div class="component"><div><div class="name">'+esc(x.probe_action)+'</div><div class="mode">HTTP '+esc(x.http_status)+' · '+fmtDT(x.probed_at)+'</div></div>'+(x.changed_from_previous?chip('cambio','amber'):chip('estable','green'))+'</div>').join('')+'</div>':'')}
function caseRelations(d){let r=d.relationships||[],a=d.relationship_activation||{};return '<div class="block"><h4>Política de activación</h4><p>Acción: <b>'+esc(label(a.activation_action||'DEFER'))+'</b> · identidad '+pct(a.identity_confidence)+' · política '+esc(a.activation_policy_code||'—')+'<br>'+esc(a.notes||'')+'</p></div><div class="block" style="margin-top:9px"><h4>Relaciones verificadas</h4>'+(r.length?r.map(x=>'<div class="evidence valid"><h4>'+esc(x.person_name)+' · '+esc(label(x.relationship_type))+'</h4><p>RUT '+esc(x.person_rut||'—')+(x.ownership_pct!=null?' · participación '+esc(Number(x.ownership_pct)*100)+'%':'')+'</p><div class="meta">'+esc(x.verification_status)+' · '+esc(x.identity_basis)+' · confianza '+pct(x.confidence)+' · graph '+(x.graph_promotion_allowed?'sí':'no')+'</div></div>').join(''):'<p>No hay relaciones primarias promovibles para este caso.</p>')+'</div>'}
function caseTrace(d){let ev=[];(d.evidence||[]).forEach(x=>ev.push({date:x.event_date,title:x.signal_code,desc:x.summary,type:'Señal'}));(d.documents||[]).forEach(x=>ev.push({date:x.document_date,title:x.document_type,desc:x.title,type:'Documento'}));(d.facts||[]).filter(x=>x.value_date).forEach(x=>ev.push({date:x.value_date,title:x.fact_code,desc:x.interpretation||x.value_text,type:'Hecho'}));(d.source_incidents||[]).forEach(x=>ev.push({date:x.opened_at,title:x.incident_type,desc:x.observed_description,type:'Incidente'}));ev.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));return '<div class="timeline">'+(ev.length?ev.map(x=>'<div class="event"><div class="date">'+fmtDate(x.date)+' · '+esc(x.type)+'</div><div class="title">'+esc(label(x.title))+'</div><div class="desc">'+esc(x.desc||'')+'</div></div>').join(''):'<div class="empty">Sin eventos.</div>')+'</div>'}
function renderAttention(){let a=DATA.attention||[];shell(head('Atención operacional','Elementos que requieren seguimiento sin convertirse automáticamente en alertas.')+'<div class="card pad"><div class="attention">'+(a.map(attentionRow).join('')||'<div class="empty">Sin atenciones activas.</div>')+'</div></div>')}
function renderSources(){let s=DATA.sources||[],p=DATA.source_probes||[];shell(head('Fuentes y frescura','Qué fuentes sostienen el sistema y cuándo fueron vistas por última vez.')+'<div class="source-grid">'+s.map(x=>'<div class="source"><div style="display:flex;justify-content:space-between;gap:7px"><h4>'+esc(x.source_name)+'</h4>'+chip(x.freshness_state,x.freshness_state==='ACTIVE'?'green':'amber')+'</div><p>'+esc(x.source_code)+' · '+esc(label(x.integration_status))+'</p><p>'+fmtN(x.item_count)+' ítems · edad '+esc(x.age_days)+' días · trust '+esc(x.trust_tier)+'</p></div>').join('')+'</div><div class="card" style="margin-top:12px"><div class="section-title"><h3>Monitoreo de cambios de fuente</h3><span>probe semántico</span></div><div class="pad">'+(p.map(x=>'<div class="attention-item"><div class="row"><span>'+chip(x.probe_action,x.changed_from_previous?'amber':'green')+'</span><span class="tiny muted">'+fmtDT(x.probed_at)+'</span></div><h4>'+esc(x.tender_id)+' · '+esc(x.document_type)+'</h4><p>HTTP '+esc(x.http_status)+' · '+fmtN(x.content_length)+' bytes · cambio semántico '+(x.changed_from_previous?'sí':'no')+'</p></div>').join('')||'<div class="empty">Sin probes registrados.</div>')+'</div></div>')}
function renderShadow(){let h=DATA.shadow_history||[],s=DATA.shadow||{};shell(head('Operación shadow','Corridas congeladas que observan cambios sin alterar el método.')+'<div class="metric-grid">'+[['Run actual',s.shadow_run_id],['Casos',s.candidate_count],['Gate vivo',s.live_gate_count],['Watch only',s.watch_only_count],['Nuevos',s.new_candidate_count],['Incidentes',s.source_incident_count]].map(x=>'<div class="card metric"><div class="value" style="font-size:'+(String(x[1]).length>8?'15':'26')+'px">'+esc(x[1]??'—')+'</div><div class="label">'+esc(x[0])+'</div></div>').join('')+'</div><div class="card" style="margin-top:12px"><div class="section-title"><h3>Historial</h3><span>últimas corridas</span></div>'+h.map(x=>'<div class="run"><div><div class="small mono">'+esc(x.shadow_run_id)+'</div><div class="tiny muted">'+fmtDT(x.completed_at)+' · '+esc(x.status)+'</div></div><div style="display:flex;gap:6px">'+chip('casos '+x.candidate_count,'blue')+chip('prom '+x.promoted_candidate_count,(x.promoted_candidate_count||0)>0?'amber':'green')+chip('dem '+x.demoted_candidate_count,'blue')+'</div></div>').join('')+'</div>')}
function renderPilot(){let r=PILOT?.run||{},a=PILOT?.acceptance||{},parts=PILOT?.participants||[];shell(head('Piloto ciego','La prueba metodológica permanece separada del simulador operacional.','<a class="btn link" href="./direct.html">Abrir piloto ciego</a>')+'<div class="metric-grid">'+[[r.status||'—','Estado'],[parts.filter(x=>x.participant_role==='ANALYST'&&x.active).length,'Analistas'],[(PILOT?.results||[]).filter(x=>x.submitted_at).length,'Evaluaciones'],[a.pending_count??'—','Criterios pendientes'],[a.provisional_pass_count??'—','Pass provisional'],[a.provisional_fail_count??'—','Fail provisional']].map(x=>'<div class="card metric"><div class="value">'+esc(x[0])+'</div><div class="label">'+esc(x[1])+'</div></div>').join('')+'</div><div class="card" style="margin-top:12px"><div class="section-title"><h3>Participantes</h3><span>RIGP-PILOT-001</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Participante</th><th>Rol</th><th>Iniciados</th><th>Enviados</th></tr></thead><tbody>'+parts.map(x=>'<tr><td>'+esc(x.display_name)+'</td><td>'+esc(x.participant_role)+'</td><td>'+esc(x.started_count)+'</td><td>'+esc(x.submitted_count)+'</td></tr>').join('')+'</tbody></table></div></div><div class="notice" style="margin-top:12px">El simulador operacional no cambia escenarios, respuestas esperadas ni criterios de aceptación del piloto ciego.</div>')}
async function reload(){try{DATA=await rpc('rigp_temp_ops_preview',{p_token:token});render()}catch(e){alert(e.message)}}
boot();
