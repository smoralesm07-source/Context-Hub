<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGP · Piloto Controlado</title>
<style>
:root{--bg:#071018;--panel:#0d1722;--line:#213244;--text:#ecf3f8;--muted:#96a8b8;--accent:#55d3b0;--blue:#72b7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#10293a 0,#071018 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}.shell{max-width:1320px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.brand{display:flex;gap:13px;align-items:center}.logo{width:42px;height:42px;border:1px solid #2f675d;border-radius:12px;display:grid;place-items:center;background:#0d2526;color:var(--accent);font-weight:800}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.badge{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:rgba(13,23,34,.95);border:1px solid var(--line);border-radius:15px;box-shadow:0 16px 40px #0004}.pad{padding:18px}.login{max-width:430px;margin:10vh auto}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:#08131d;border:1px solid #263b4f;color:var(--text);border-radius:9px;padding:11px 12px;outline:none}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#3f796e}.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;background:#1b3042;color:#eaf2f7}.btn.primary{background:#1f6f60;color:white}.btn.ghost{border:1px solid var(--line);background:transparent;color:var(--muted)}.btn:disabled{opacity:.45;cursor:not-allowed}.scenario-list{padding:10px}.sc{padding:12px;border:1px solid transparent;border-radius:10px;cursor:pointer;margin-bottom:5px}.sc:hover,.sc.active{background:#122231;border-color:#284159}.sc .code{font-weight:750;color:var(--accent);font-size:12px}.sc .title{font-size:13px;margin-top:4px}.sc .state{font-size:11px;color:var(--muted);margin-top:5px}.main{min-height:640px}.hero{padding:20px;border-bottom:1px solid var(--line)}.hero h2{margin:4px 0 8px;font-size:23px}.muted{color:var(--muted)}.small{font-size:12px}.section{padding:18px 20px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section h3{margin:0 0 12px;font-size:14px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.fact{background:#0a141e;border:1px solid #1b2b3c;border-radius:10px;padding:10px}.fact .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.fact .v{margin-top:5px;font-size:13px;word-break:break-word}.ev{border-left:2px solid #315364;padding:8px 11px;margin:9px 0;background:#0b1621;border-radius:0 8px 8px 0;display:block}.ev .meta{font-size:11px;color:var(--muted);margin-top:5px}.miss{padding:10px;border:1px solid #574827;background:#211b0d;border-radius:9px;margin:7px 0;color:#f0dba6}.source a{color:var(--blue);text-decoration:none;word-break:break-all}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.range{display:flex;align-items:center;gap:12px}.range input{padding:0}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}.notice{padding:10px 12px;border-radius:9px;background:#0b201c;border:1px solid #234e45;color:#b6eadc;font-size:12px;margin-bottom:12px}.error{background:#281415;border-color:#643235;color:#ffb9b9}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:14px;background:#0a141e;border:1px solid var(--line);border-radius:10px}.metric .n{font-size:24px;font-weight:750}.metric .l{font-size:11px;color:var(--muted);margin-top:4px}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:9px 8px;border-bottom:1px solid #1b2b3c;text-align:left}@media(max-width:850px){.grid{grid-template-columns:1fr}.scenario-list{display:flex;overflow:auto}.sc{min-width:180px}.form-grid{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr 1fr}.shell{padding:12px}}
</style></head><body><div id="app"></div>
<script>
const SUPABASE_URL='https://ldmtlwzqaqmegedktlxr.supabase.co';
const KEY='sb_publishable_Nu21dZFBM3NwtIvOwIM8ag_9tyfDJyR';
const RUN='RIGP-PILOT-001';
let session=null,profile=null,scenarios=[],results=[],active=null;const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function arr(v){return Array.isArray(v)?v:[]}function lines(v){return String(v||'').split(/\n+/).map(x=>x.trim()).filter(Boolean)}
async function call(path,opt={}){return fetch(SUPABASE_URL+path,{...opt,headers:{apikey:KEY,'content-type':'application/json',...(opt.headers||{})}})}function store(s){session=s;if(s)localStorage.setItem('rigp_session',JSON.stringify(s));else localStorage.removeItem('rigp_session')}
async function refresh(){if(!session?.refresh_token)return false;let r=await call('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;store(await r.json());return true}
async function rpc(name,args={}){if(!session?.access_token)throw new Error('Sesión requerida');let go=()=>call('/rest/v1/rpc/'+name,{method:'POST',headers:{Authorization:'Bearer '+session.access_token},body:JSON.stringify(args)});let r=await go();if(r.status===401&&await refresh())r=await go();let d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.hint||'Error de operación');return d}
function loginView(msg=''){app.innerHTML='<div class="shell"><div class="login card pad"><div class="brand"><div class="logo">R</div><div><h1>RIGP</h1><p>Piloto Controlado · RIGP-PILOT-001</p></div></div><h2 style="margin-top:24px">Acceso al piloto</h2><p class="muted small">Use la cuenta habilitada para el piloto. La sesión se mantiene hasta cerrar sesión.</p>'+(msg?'<div class="notice error">'+esc(msg)+'</div>':'')+'<form id="login"><div class="field"><label>Correo</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="pwd" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%">Ingresar</button></form></div></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{let r=await call('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:pwd.value})});let d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Credenciales inválidas');store(d);await boot()}catch(err){loginView(err.message)}}}
async function boot(){try{profile=(await rpc('rigp_pilot_get_session',{p_run_id:RUN}))?.[0];if(!profile)throw new Error('La cuenta no está habilitada para este piloto.');if(profile.pilot_role==='ADMIN')return adminView();scenarios=await rpc('rigp_pilot_get_scenarios',{p_run_id:RUN})||[];results=await rpc('rigp_pilot_get_my_results',{p_run_id:RUN})||[];renderAnalyst()}catch(err){store(null);loginView(err.message)}}
function shell(inner,side=''){return '<div class="shell"><div class="top"><div class="brand"><div class="logo">R</div><div><h1>RIGP · Piloto Controlado</h1><p>'+esc(profile?.display_name||'')+' · '+esc(profile?.pilot_role||'')+'</p></div></div><div><span class="badge">'+esc(profile?.run_status||'')+'</span> <button id="logout" class="btn ghost">Cerrar sesión</button></div></div>'+(side?'<div class="grid">'+side+'<main class="card main">'+inner+'</main></div>':'<main class="card main">'+inner+'</main>')+'</div>'}
function analystSide(){return '<aside class="card scenario-list">'+scenarios.map(s=>{let r=results.find(x=>x.public_code===s.public_code),st=r?.submitted_at?'Enviado':r?'Borrador':'Pendiente';return '<div class="sc '+(active?.public_code===s.public_code?'active':'')+'" data-code="'+esc(s.public_code)+'"><div class="code">ESCENARIO '+esc(s.public_code)+'</div><div class="title">'+esc(s.display_title.replace(/^Escenario [A-G] — /,''))+'</div><div class="state">'+st+'</div></div>'}).join('')+'</aside>'}
function renderAnalyst(){if(!active)active=scenarios[0];if(!active){app.innerHTML=shell('<div class="section"><p class="muted">No hay escenarios disponibles.</p></div>');return wireCommon()}let r=results.find(x=>x.public_code===active.public_code)||{},submitted=!!r.submitted_at,h=active.header||{};let inner='<div class="hero"><div class="muted small">ESCENARIO '+esc(active.public_code)+' · Corte '+esc(active.temporal_cutoff)+'</div><h2>'+esc(active.display_title)+'</h2><p class="muted">'+esc(active.analyst_prompt)+'</p></div><div class="section"><h3>Antecedentes del proceso</h3><div class="facts">'+Object.entries(h).map(([k,v])=>'<div class="fact"><div class="k">'+esc(k.replaceAll('_',' '))+'</div><div class="v">'+esc(typeof v==='number'?new Intl.NumberFormat('es-CL').format(v):v)+'</div></div>').join('')+'</div></div><div class="section"><h3>Evidencia disponible al corte</h3>'+arr(active.evidence).map((e,i)=>'<label class="ev"><div><input class="evchk" type="checkbox" value="'+esc(e.signal_code||e.kind+'_'+(i+1))+'" '+(arr(r.evidence_ids).includes(e.signal_code||e.kind+'_'+(i+1))?'checked':'')+' '+(submitted?'disabled':'')+'> '+esc(e.fact||'Evidencia')+'</div><div class="meta">'+[e.kind,e.signal_code,e.source,e.first_detectable_date,e.strength!=null?'fuerza '+e.strength:null].filter(Boolean).map(esc).join(' · ')+'</div></label>').join('')+'</div><div class="section"><h3>Información conocida como faltante</h3>'+arr(active.known_missing).map(x=>'<div class="miss">'+esc(x)+'</div>').join('')+(arr(active.source_links).length?'<div class="source" style="margin-top:12px">'+arr(active.source_links).map(x=>'<div><a href="'+esc(x.url)+'" target="_blank" rel="noopener">Abrir fuente '+esc(x.source||'primaria')+'</a></div>').join('')+'</div>':'')+'</div><div class="section"><h3>Decisión del analista</h3>'+(submitted?'<div class="notice">Esta evaluación fue enviada y quedó bloqueada para edición.</div>':'')+'<div class="form-grid"><div><div class="field"><label>Resultado del gate</label><select id="gate" '+(submitted?'disabled':'')+'><option value="">Seleccione…</option>'+['PROMOTE','WATCH_ONLY','DO_NOT_PROMOTE','NEEDS_MORE_EVIDENCE'].map(x=>'<option '+(r.analyst_gate_outcome===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Confianza: <span id="cv">'+Math.round((r.confidence??0.5)*100)+'</span>%</label><div class="range"><input id="conf" type="range" min="0" max="100" value="'+Math.round((r.confidence??0.5)*100)+'" '+(submitted?'disabled':'')+'></div></div></div><div class="field"><label>Decisión analítica breve</label><textarea id="decision" '+(submitted?'disabled':'')+'>'+esc(r.analyst_decision||'')+'</textarea></div><div class="field full"><label>Fundamento</label><textarea id="rationale" '+(submitted?'disabled':'')+'>'+esc(r.rationale||'')+'</textarea></div><div class="field"><label>Información faltante relevante · una por línea</label><textarea id="missing" '+(submitted?'disabled':'')+'>'+esc(arr(r.missing_information).join('\n'))+'</textarea></div><div class="field"><label>Controles de falso positivo considerados · uno por línea</label><textarea id="controls" '+(submitted?'disabled':'')+'>'+esc(arr(r.false_positive_controls_considered).join('\n'))+'</textarea></div></div>'+(submitted?'':'<div class="actions"><button id="draft" class="btn">Guardar borrador</button><button id="submit" class="btn primary">Enviar evaluación</button></div>')+'</div>';app.innerHTML=shell(inner,analystSide());wireCommon();document.querySelectorAll('.sc').forEach(el=>el.onclick=()=>{active=scenarios.find(s=>s.public_code===el.dataset.code);renderAnalyst()});let c=document.getElementById('conf');if(c)c.oninput=()=>document.getElementById('cv').textContent=c.value;if(!submitted){document.getElementById('draft').onclick=()=>save(false);document.getElementById('submit').onclick=()=>save(true)}}
async function save(send){try{let gate=document.getElementById('gate'),decision=document.getElementById('decision'),conf=document.getElementById('conf'),rationale=document.getElementById('rationale'),missing=document.getElementById('missing'),controls=document.getElementById('controls');if(!gate.value)throw new Error('Seleccione un resultado del gate.');if(send&&!rationale.value.trim())throw new Error('Debe fundamentar la decisión antes de enviar.');await rpc('rigp_pilot_begin_scenario',{p_run_id:RUN,p_public_code:active.public_code});await rpc('rigp_pilot_save_result',{p_run_id:RUN,p_public_code:active.public_code,p_analyst_decision:decision.value.trim(),p_gate_outcome:gate.value,p_confidence:Number(conf.value)/100,p_rationale:rationale.value.trim(),p_evidence_ids:[...document.querySelectorAll('.evchk:checked')].map(x=>x.value),p_missing_information:lines(missing.value),p_false_positive_controls:lines(controls.value),p_submit:send});results=await rpc('rigp_pilot_get_my_results',{p_run_id:RUN})||[];renderAnalyst()}catch(err){alert(err.message)}}
async function adminView(){try{let d=await rpc('rigp_pilot_admin_get_dashboard',{p_run_id:RUN})||{},scores=await rpc('rigp_pilot_admin_get_scores',{p_run_id:RUN})||[],prog=d.progress||d.run_progress||d;let inner='<div class="hero"><div class="muted small">ADMINISTRACIÓN</div><h2>RIGP-PILOT-001</h2><p class="muted">Monitoreo del piloto ciego. Las respuestas esperadas permanecen fuera de la experiencia de analistas.</p></div><div class="section"><div class="admin-grid">'+[['Estado',prog.status||profile.run_status],['Enviadas',prog.submitted_result_count??0],['Esperadas',14],['Avance',String(prog.completion_pct??0)+'%']].map(x=>'<div class="metric"><div class="n">'+esc(x[1])+'</div><div class="l">'+esc(x[0])+'</div></div>').join('')+'</div></div><div class="section"><h3>Evaluaciones recibidas</h3>'+(scores.length?'<div style="overflow:auto"><table class="table"><thead><tr><th>Esc.</th><th>Analista</th><th>Gate</th><th>Conf.</th><th>Tiempo</th><th>Enviada</th></tr></thead><tbody>'+scores.map(x=>'<tr><td>'+esc(x.public_code)+'</td><td>'+esc(x.display_name||'')+'</td><td>'+esc(x.analyst_gate_outcome||'—')+'</td><td>'+esc(x.confidence==null?'—':Math.round(x.confidence*100)+'%')+'</td><td>'+esc(x.elapsed_minutes==null?'—':Number(x.elapsed_minutes).toFixed(1)+' min')+'</td><td>'+esc(x.submitted_at?'Sí':'No')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Aún no hay evaluaciones enviadas.</p>')+'</div>';app.innerHTML=shell(inner);wireCommon()}catch(err){app.innerHTML=shell('<div class="section"><div class="notice error">'+esc(err.message)+'</div></div>');wireCommon()}}
function wireCommon(){let b=document.getElementById('logout');if(b)b.onclick=()=>{store(null);profile=null;scenarios=[];results=[];active=null;loginView()}}
(async()=>{try{let raw=localStorage.getItem('rigp_session');if(raw)session=JSON.parse(raw);if(session)await boot();else loginView()}catch{store(null);loginView()}})();
</script></body></html>
