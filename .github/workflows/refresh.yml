name: Refresh Context Hub
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_seed.py
      - run: pytest -q
      - run: python scripts/run_pipeline.py --network
      - run: python scripts/validate.py
      - name: Commit only valid outputs
        run: |
          git config user.name "context-hub-bot"
          git config user.email "context-hub-bot@users.noreply.github.com"
          git add data/silver data/gold
          git diff --cached --quiet || git commit -m "context: refresh fuentes oficiales"
          git pull --rebase origin main
          git push
