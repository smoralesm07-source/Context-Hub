name: Context Hub CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'data/reference/**'
      - 'interop/**'
      - 'requirements.txt'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/build_seed.py
      - run: python scripts/validate.py
