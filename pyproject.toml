[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-hub-chile"
version = "0.1.0"
description = "Capa contextual interoperable para el sistema de radares OSINT"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
